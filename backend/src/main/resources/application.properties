server.port=8080
spring.application.name=demo-backend

spring.datasource.url=jdbc:mysql://${DB_HOST:demo-mysql}:${DB_PORT:3306}/${DB_NAME:demo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:demoapp}
spring.datasource.password=${DB_PASSWORD:demopass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5
