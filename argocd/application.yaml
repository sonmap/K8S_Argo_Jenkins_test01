apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-argo-jenkins-test01
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sonmap/K8S_Argo_Jenkins_test01.git
    targetRevision: main
    path: gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: cicd-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
