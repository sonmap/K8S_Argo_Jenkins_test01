<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Noto Sans KR", sans-serif; background: #f4f7fb; color: #172033; }
    header { background: #1f3a5f; color: white; padding: 18px 28px; }
    header .inner, main { max-width: 1100px; margin: 0 auto; }
    nav a { color: white; margin-right: 18px; text-decoration: none; font-weight: 600; }
    main { padding: 32px 20px; }
    .hero { background: white; border-radius: 16px; padding: 32px; margin-bottom: 24px; border: 1px solid #dbe4ef; }
    .hero h1 { margin-top: 0; color: #326ce5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    .card { background: white; border: 1px solid #dbe4ef; border-radius: 14px; padding: 22px; }
    .card h3 { margin-top: 0; }
    .price { font-size: 28px; font-weight: 700; color: #326ce5; }
    .btn { display: inline-block; margin-top: 14px; padding: 10px 16px; border-radius: 8px; background: #326ce5; color: white; text-decoration: none; }
    .muted { color: #667085; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <strong>K8S Demo Shop</strong>
      <nav style="margin-top:10px">
        <a href="/">메인</a>
        <a href="/frontend.html">Frontend</a>
        <a href="/backend.html">Backend/Admin</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero">
      <h1>Frontend 사용자 화면</h1>
      <p>이 화면은 실제 서비스의 사용자용 웹 화면을 단순화한 예제입니다.</p>
      <p class="muted">HTML / CSS / JavaScript 파일은 Docker Image 안에 포함되어 Nginx에서 서비스됩니다.</p>
    </section>

    <section class="grid">
      <div class="card">
        <h3>Starter</h3>
        <div class="price">₩9,900</div>
        <p>개인 사용자용 기본 상품</p>
        <a class="btn" href="#">신청하기</a>
      </div>
      <div class="card">
        <h3>Business</h3>
        <div class="price">₩39,000</div>
        <p>중소기업용 서비스 패키지</p>
        <a class="btn" href="#">신청하기</a>
      </div>
      <div class="card">
        <h3>Enterprise</h3>
        <div class="price">문의</div>
        <p>대규모 기업용 고가용성 구성</p>
        <a class="btn" href="#">상담 요청</a>
      </div>
    </section>
  </main>
</body>
</html>
